name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: backend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check backend exists
        id: check
        run: echo "exists=$(test -f backend/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run lint --if-present
      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run typecheck --if-present
      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm test --if-present
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run build --if-present

  frontends:
    name: frontends (lint / build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [labour-app, admin-panel]
    steps:
      - uses: actions/checkout@v4
      - name: Check app exists
        id: check
        run: echo "exists=$(test -f ${{ matrix.app }}/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.app }}
        run: npm run lint --if-present
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.app }}
        run: npm run build --if-present

  # Placeholder for the automated review-findings step described in CONTRIBUTING.md.
  # Wired up to actually post PR comments once the review-agent workflow is confirmed.
  review-checklist-reminder:
    name: review checklist reminder
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Remind
        run: |
          echo "Reminder: this PR requires an explicit correctness/concurrency review (see CONTRIBUTING.md) and the repo owner's explicit sign-off before merge. CI passing is necessary but not sufficient."
